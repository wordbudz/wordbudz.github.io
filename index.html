<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordBudz</title>

    <!-- Primary Meta Tags -->
    <title>WordBudz</title>
    <meta name="title" content="WordBudz">
    <meta name="description" content="Find Your Word a Bud">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://wordbudz.github.io/">
    <meta property="og:title" content="WordBudz">
    <meta property="og:description" content="Find Your Word a Bud">
    <meta property="og:image" content="https://baggy-whirlwind-plover.anvil.app/_/theme/wordbudz-high-resolution-logo-white.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="WordBudz Logo">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://wordbudz.github.io/">
    <meta property="twitter:title" content="WordBudz">
    <meta property="twitter:description" content="Find Your Word a Bud">
    <meta property="twitter:image" content="https://baggy-whirlwind-plover.anvil.app/_/theme/wordbudz-high-resolution-logo-white.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="WordBudz Logo">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://baggy-whirlwind-plover.anvil.app/_/theme/download.png">
    <link href="https://fonts.googleapis.com/css2?family=Handlee&family=Raleway:wght@100&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Handlee, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: #2F5E4F; /* Darker green */
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            transition: width 0.3s ease;
        }

        .sidebar h1 {
            margin-bottom: 40px;
            font-size: 28px;
            font-weight: bold;
            transition: opacity 0.3s ease;
        }

        .sidebar button {
            width: 180px;
            padding: 12px 18px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background-color: white;
            color: #2F5E4F;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
            font-family: Handlee, sans-serif;
        }

        .sidebar button:hover {
            background-color: #e6e6e6;
        }

        /* Main content area */
        .main {
            flex: 1;
            background-color: #f5f5f5;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Prevent scrollbars */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 20px;
            display: block;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);

            /* Hide scrollbars inside iframe */
            scrollbar-width: none;
            clip-path: inset(0 round 20px);
        }

        iframe::-webkit-scrollbar {
            display: none;
        }

        /* Mobile collapsible sidebar */
        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
                padding: 10px;
            }

            .sidebar h1 {
                opacity: 0;
                pointer-events: none;
            }

            .sidebar button {
                width: 40px;
                font-size: 0;
                padding: 10px;
            }

            .sidebar button::after {
                content: '•';
                font-size: 24px;
                color: white;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h1>
          <img src="https://baggy-whirlwind-plover.anvil.app/_/theme/budz4.png" alt="WordBudz" width="200">
        </h1>

        <button onclick="openPlay()"><i class="fa-solid fa-gamepad"></i> Play Online</button>

        <button id="install-btn" style="display:none;" onclick="installApp()">
          <i class="fa-solid fa-download"></i> Install App
        </button>


    </div>

    <!-- Main content with iframe -->
    <div class="main">
        <iframe src="https://baggy-whirlwind-plover.anvil.app"></iframe>
    </div>

    <script>
    let deferredPrompt = null;
    
    document.addEventListener("DOMContentLoaded", function () {
    
        function openPlay() {
            document.querySelector("iframe").contentWindow.location.href =
                "https://baggy-whirlwind-plover.anvil.app";
        }
    
        // Listen for the PWA install availability
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById("install-btn").style.display = "block";
        });
    
        // Install function tied to your button
        window.installApp = function () {
            if (!deferredPrompt) return;
    
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => {
                deferredPrompt = null;
            });
        };
    
    });
    </script>




</body>
</html>
