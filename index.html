<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordBudz</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: #40826D;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar h1 {
            margin-bottom: 40px;
            font-size: 28px;
            font-weight: bold;
        }

        .sidebar button {
            width: 180px;
            padding: 12px 18px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background-color: white;
            color: #40826D;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .sidebar button:hover {
            background-color: #e6e6e6;
        }

        /* Main content area */
        .main {
            flex: 1;
            background-color: #f5f5f5;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 95%;
            height: 95%;
            border: none;
            border-radius: 16px;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h1>WordBudz</h1>

        <button onclick="openPlay()">Play Online</button>
        <button onclick="window.open('https://apps.apple.com/', '_blank')">Download on iOS</button>
        <button onclick="window.open('https://play.google.com/', '_blank')">Download on Play Store</button>
    </div>

    <!-- Main content with iframe -->
    <div class="main">
        <script src="https://anvil.works/embed.js" async></script>
        <iframe style="width:100%;" data-anvil-embed src="https://baggy-whirlwind-plover.anvil.app"></iframe>
    </div>

    <script>
        function openPlay() {
            // Scroll iframe to top or trigger any future logic
            document.querySelector("iframe").contentWindow.location.href = "https://baggy-whirlwind-plover.anvil.app";
        }
    </script>

</body>
</html>
